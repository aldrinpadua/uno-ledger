<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNO has moved</title>
  <link rel="icon" type="image/svg+xml" href="https://aldrinpadua.com/uno/assets/logo.svg" />
  <!-- Preserve any ?invite=… query and #hash so old invite/login links keep working. -->
  <script>
    (function () {
      var dest = "https://aldrinpadua.com/uno/" + (location.search || "") + (location.hash || "");
      location.replace(dest);
    })();
  </script>
  <!-- Fallback if JS is disabled -->
  <meta http-equiv="refresh" content="1; url=https://aldrinpadua.com/uno/" />
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 80% -10%, #1a2430 0%, #0f1216 55%);
      color: #e6edf3; text-align: center; padding: 24px;
    }
    .card { max-width: 360px; }
    img { width: 56px; height: 56px; }
    h1 { font-size: 22px; margin: 14px 0 4px; }
    .sub { color: #9aa7b4; font-size: 14px; margin: 0 0 18px; }
    a.btn {
      display: inline-block; background: #4f9dff; color: #fff; text-decoration: none;
      padding: 11px 18px; border-radius: 9px; font-weight: 600; font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://aldrinpadua.com/uno/assets/logo.svg" alt="UNO" />
    <h1>UNO has a new home</h1>
    <p class="sub">one place. one us.</p>
    <p class="sub">Taking you there now…</p>
    <a class="btn" href="https://aldrinpadua.com/uno/">Go to UNO</a>
  </div>
</body>
</html>
